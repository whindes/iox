apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-ui.fullname" . }}
  labels:
    {{- include "nginx-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.ports.https }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "nginx-ui.selectorLabels" . | nindent 4 }}
