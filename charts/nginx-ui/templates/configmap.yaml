{{- if .Values.nginx.configMap -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-ui.fullname" . }}-nginx-config
  labels:
    {{- include "nginx-ui.labels" . | nindent 4 }}
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    error_log  /var/log/nginx/error.local.log notice;
    pid        /var/run/nginx.pid;

    events {
        worker_connections  1024;
    }

    stream {
        include /etc/nginx/streams-enabled/*;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        gzip  on;

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
    }
  {{ .Values.nginx.siteName }}.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    # Determine forwarded protocol with fallback
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    
    # Determine forwarded host with fallback  
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ''      $http_host;
    }

    server {
        listen       80;
        server_name  {{ .Values.nginx.serverName }};
        client_max_body_size 128M;
        
        # Real IP handling for reverse proxy
        real_ip_header X-Forwarded-For;
        set_real_ip_from 0.0.0.0/0;

        location / {
            proxy_pass http://localhost:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Use forwarded headers from upstream proxy with fallbacks
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
{{- range .Values.nginx.proxySites }}
  {{ .serverName }}.conf: |
    upstream u-{{ .serverName }} {
        server {{ .upstream }} weight=3 max_fails=3 fail_timeout=2s;
        hash $http_x_forwarded_for consistent; 
        keepalive 32;
    }
    server {
        listen       80;
        server_name  {{ .serverName }};
        client_max_body_size 128M;

        real_ip_header X-Forwarded-For;
        set_real_ip_from 0.0.0.0/0;

        location / {
            set $upstream u-{{ .serverName }};
            proxy_pass http://$upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
{{- end }}
{{- end -}}