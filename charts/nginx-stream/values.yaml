affinity: {}
autoscaling:
  enabled: false
  maxReplicas: 100
  minReplicas: 1
  targetCPUUtilizationPercentage: 80
certManager:
  enabled: true
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
configmap:
  config:
    customRsyncProxySetup: /opt/lb/xyz-rsync-client.sh
    decodeBase64: true
    encodedData: >
      
    plainText: |-
      #!/bin/bash
      echo "Hello World"
      echo "This is a large script"
    rsyncUniqueFile: wp-config.php
  enabled: true
externalSecrets:
  enabled: false
  secretStore:
    kind: SecretStore
    name: local-vault
    secretFile: .secretvals
  secretTLSStore:
    kind: SecretStore
    name: local-vault
    secretFile: .secret-tls-vals
fullnameOverride: xyz-lb-nginx-stream
image:
  env:
    - name: RELEASE_BUILD
      value: '1.0'
    - name: CUSTOM_RSYNCPROXY_SETUP
      value: /opt/lb/xyz-rsync-client.sh
    - name: LB_ENV
      value: wp_xyz
    - name: ROOT_DOMAIN
      value: example.io
    - name: RSYNC_REMOTE_SOURCE
      value: xyz.example.io
    - name: RSYNC_REMOTE_SRC_DIR
      value: /opt/lb_rsync/wp_remote
    - name: RSYNC_SOURCE_TARGET
      value: wordpress
    - name: RSYNC_SOURCE_TYPE
      value: remote
    - name: RSYNC_SSH_KEY
      value: /etc/ssl/private/xyz.pem
    - name: RSYNC_SSH_USER
      value: svc_user
    - name: SITE_NAME
      value: wp.example.io
    - name: SYSLOG_SERVICE_HOSTNAME
      value: ngxvector.example.io
    - name: TLS_CERT_UPDATED
      value: mounted
    - name: WEBSITES_PORT
      value: '80'
    - name: WP_KUBE_SVC
      value: xyz-api-wordpress-fpm.example.svc.cluster.local
  pullPolicy: Always
  repository: whindes/xyz-lb
  tag: 0.5.1
imagePullSecrets: []
ingress:
  annotations: {}
  className: nginx
  enabled: true
  hosts:
    - host: wp.example.io
      paths:
        - backend:
            service:
              name: xyz-lb-nginx-stream
              port:
                number: 80
          path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - wp.example.io
      secretName: tls-wp-ingress
livenessProbe:
  httpGet:
    path: /
    port: http
nameOverride: nginx-stream
nodeSelector: {}
persistence:
  accessMode: ReadWriteOnce
  additionalMounts: []
  additionalVolumes: []
  enabled: false
  existingClaim: xyz-api-wordpress-fpm
  size: 800Mi
  storageClass: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
readinessProbe:
  httpGet:
    path: /
    port: http
replicaCount: 1
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
secrets:
  sshPrivateKey: >-
    LS0tLS1CRUdJTfUFJJVkFURV9LRVlfUExBQ0VIT0xERVJfRE9fTk9UX1VTRV9USElTX1ZBTFVFX2FiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MAo=
  sshPrivateKeyName: xyz.pem
  tlsCertificate: >-
    LS0tLS1CRUdJT0VSVElGSUNBVEVfUExBQ0VIT0xERVJfRE9fTk9UX1VTRV9USElTX1ZBTFVFX2FiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MAo=
  tlsKey: >-
    LS0tLS1CRUdJT0VZX1BMQUNFSE9MREVSX0RPX05PVF9VU0VfVEhJU19WQUxVRV9hYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5ejEyMzQ1Njc4OTAK
  tlsSecretname: tls-wp-ingress
  tlsSecrets:
    - hosts:
        - wp.example.io
      name: tls-wp-ingress
securityContext: {}
service:
  clusterIP: None
  port: 80
  type: ClusterIP
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ''
tolerations: []
volumeMounts:
  - mountPath: /etc/tlsx/wpx
    name: tls-wp-ingress
  - mountPath: /opt/lb/xyz-rsync-client.sh
    name: xyz-rsync-client
    subPath: xyz-rsync-client.sh
  - mountPath: /etc/ssl/private/xyz.pem
    name: xyz-ssh-key
    readOnly: true
    subPath: xyz.pem
volumes:
  - name: tls-wp-ingress
    secret:
      secretName: tls-wp-ingress
  - configMap:
      defaultMode: 493
      name: xyz-lb-nginx-stream-config
    name: xyz-rsync-client
  - name: xyz-ssh-key
    secret:
      defaultMode: 384
      items:
        - key: xyz.pem
          path: xyz.pem
      secretName: xyz-lb-nginx-stream-secrets
global:
  cattle:
    clusterId: local
    clusterName: xyz-cluster
    systemDefaultRegistry: ''
  systemDefaultRegistry: ''
